[workspace]
members = ["crates/wsbox-review"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
# A floor, not a target: this is the oldest toolchain the workspace is tested
# on. `let` chains (2024 edition) need 1.88; the workspace is checked against
# 1.92 in CI, and built with whatever stable the developer or CI has.
rust-version = "1.92"
license = "MIT"

[package]
name = "wsbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Workspace ledger sandbox: every write is observed, diffed and reversible"
repository = "https://github.com/qaqtamsy/wsbox"

[lib]
name = "wsbox"
path = "src/lib.rs"

[[bin]]
name = "wsbox"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.30", features = [
    "sched",
    "mount",
    "user",
    "fs",
    "process",
    "signal",
] }
libc = "0.2"
walkdir = "2"
sha2 = "0.10"
similar = "2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
