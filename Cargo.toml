[package]
name = "wsbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Workspace ledger sandbox: every write is observed, diffed and reversible"
repository = "https://github.com/qaqtamsy/wsbox"

[lib]
name = "wsbox"
path = "src/lib.rs"

[[bin]]
name = "wsbox"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.30", features = [
    "sched",
    "mount",
    "user",
    "fs",
    "process",
    "signal",
] }
libc = "0.2"
walkdir = "2"
sha2 = "0.10"
similar = "2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
